name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache upstream py-aep and its samples
        uses: actions/cache@v4
        with:
          path: .upstream
          key: upstream-${{ hashFiles('UPSTREAM_COMMIT', 'tools/lfs_fetch.py') }}

      - run: bun install --frozen-lockfile

      - name: Fetch upstream samples
        run: tools/fetch-samples.sh

      - name: Typecheck
        run: bun run typecheck

      - name: Upstream test suite
        run: bun test --timeout 60000

      - name: Byte-identical round trip of every sample
        run: |
          bun tools/corpus_roundtrip.ts | tee roundtrip.json
          python3 -c "import json,sys; r=json.loads(open('roundtrip.json').readline()); sys.exit(0 if r['identical']==r['total'] else 1)"

      - name: Packed tarball works in Node and Bun
        run: tools/pack_smoke.sh

  # The py-aep differential is opt-in: put `[ci diff]` in the head commit
  # message, or run the workflow by hand.
  wants-differential:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - id: check
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] || git log -1 --format=%B | grep -qF '[ci diff]'; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
          fi

  differential:
    needs: wants-differential
    if: needs.wants-differential.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: astral-sh/setup-uv@v6

      - name: Cache upstream py-aep and its samples
        uses: actions/cache@v4
        with:
          path: .upstream
          key: upstream-${{ hashFiles('UPSTREAM_COMMIT', 'tools/lfs_fetch.py') }}

      - run: bun install --frozen-lockfile

      - name: Fetch upstream samples
        run: tools/fetch-samples.sh

      - name: Differential check against py-aep
        run: |
          (cd .upstream && uv sync -q)
          tools/diff/run.sh 4
          tools/diff/edit_run.sh 40 4
          python3 tools/diff/gate.py
